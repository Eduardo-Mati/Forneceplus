
<div class="Container">
  <div class="login-form">
    <form [formGroup]="loginForm" class="loginContainer">
      <h1>Login</h1>
      
      <mat-form-field appearance="outline">
        <mat-label>Login</mat-label>
        <input type="email" formControlName="login" matInput placeholder="Digite seu login">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input type="password" formControlName="password" matInput placeholder="Digite sua senha">
      </mat-form-field>

      <button (click)="enviarDados()" matButton="filled" type="submit">Enviar</button>

      <p>Não possui uma conta? <a href="/cadastro">Cadastre-se</a></p>
    </form>
  </div>
</div>

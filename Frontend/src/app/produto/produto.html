<div class="Container">
	<div class="login-form">
		<form [formGroup]="produtoForm" class="loginContainer" (ngSubmit)="enviarDados()">
			<h1>Cadastro de produto</h1>

			<mat-form-field appearance="outline">
				<mat-label>Nome do produto</mat-label>
				<input type="text" formControlName="nomeProduto" matInput placeholder="Digite o nome do produto">
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>Quantidade</mat-label>
				<input type="number" formControlName="quantidade" matInput placeholder="Digite a quantidade">
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>Descrição</mat-label>
				<input type="text" formControlName="descricao" matInput placeholder="Descreva o produto">
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>Preço</mat-label>
				<input type="number" formControlName="preco" matInput placeholder="Digite o preço">
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>ID da categoria</mat-label>
				<input type="number" formControlName="idCategoria" matInput placeholder="Digite o ID da categoria">
			</mat-form-field>

			<mat-form-field appearance="outline">
				<mat-label>ID do fornecedor</mat-label>
				<input type="number" formControlName="idFornecedor" matInput placeholder="Digite o ID do fornecedor">
			</mat-form-field>

			<button matButton="filled" type="submit" [disabled]="produtoForm.invalid" (click)="enviarDados()">Cadastrar</button>

		</form>
	</div>
</div>
